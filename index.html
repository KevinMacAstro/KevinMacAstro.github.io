<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kevin Spencer McCarthy</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/asterism.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="/style.css" />
</head>

<body class="front-page">

  <div class="background"></div>
  <div class="asterism"></div>
  <div class="border-line"></div>
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
  <div class="mask-left"></div>
  <div class="mask-right"></div>

  <div class="content-wrapper">
    <div class="content-container">
      <div class="chat-wrapper">

        <div class="profile-photo">
          <img src="KevinPalomar.png" alt="Kevin Spencer McCarthy" />
        </div>

        <div class="center-image">
          <a href="https://db.ipmu.jp/member/personal/7718en.html">
            <img src="KSM_fontTITLE.png" alt="Kevin Spencer McCarthy" />
          </a>
        </div>

        <div class="social-icons">
        
         <a href="https://github.com/KevinMacAstro"
            target="_blank"
            rel="noopener noreferrer"
            class="social-icon">
           <img src="github_icon.png" class="icon-default" alt="GitHub">
           <img src="github_eyes.png" class="icon-hover" alt="">
         </a>
        
         <a href="https://www.instagram.com/kevmacastro/"
            target="_blank"
            rel="noopener noreferrer"
            class="social-icon">
           <img src="instagram_icon.png" class="icon-default" alt="Instagram">
           <img src="instagram_flash.png" class="icon-hover" alt="">
         </a>
        
         <a href="#"
           class="social-icon email-copy"
           onclick="copyEmail(event)"
           aria-label="Copy email address">
          <img src="email_icon.png" class="icon-default" alt="">
          <img src="email_arrow.png" class="icon-hover" alt="">
         </a>
        
        </div>

        <div class="link-row">
         <a href="talks.html" class="glow-link-box glow-hover">
           <span>Recent Talks and Posters</span>
         </a>
        
         <a href="tools.html" class="glow-link-box glow-hover">
           <span>Astronomical Tools</span>
         </a>

         <a href="CV.html" class="glow-link-box glow-hover">
           <span>Curriculum Vitae</span>
         </a>

        </div>

        <form id="chat-form">
         <textarea id="user-input" placeholder="Ask something specific about my papers — e.g. methods, results, findings…" required rows="2"></textarea>
         <button type="submit">Submit</button>
        </form>

        <div class="chat-source-note">
          Responses sourced only from my first-author papers:
          <a href="https://orcid.org/0000-0001-6857-018X" target="_blank" rel="noopener noreferrer"> 0000-0001-6857-018X </a>
        </div>


        <div id="chat-output" class="chat-box"></div>

      </div>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
